name: wallet
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        uv sync
    - name: Lint with flake8
      run: |
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run migrations
      env:
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_SERVER: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DATABASE: test
      run: |
        uv run alembic upgrade head
    - name: Test with pytest
      env:
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_SERVER: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DATABASE: test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        uv run pytest
